<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EcoOils HSSE Database Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f6f3; --surface:#ffffff; --surface2:#f3f7f5; --ink:#221e1f; --mute:#5f6b66; --line:#d3ddd8;
  --accent:#44a276; --accent-ink:#ffffff; --accent-text:#2b7a55; --gold:#ffc600; --ok:#216b49; --ok-bg:#dff1e8; --off:#5d6b75; --off-bg:#e6ebe9; --bad:#b42318; --bad-bg:#fbe0dd; --wa:#1faa59;
  --f-display:"Public Sans",system-ui,sans-serif; --f-body:"Public Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding:0 16px 40px}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:20px 0 14px;border-bottom:4px solid var(--gold)}
h1{font:800 clamp(20px,4vw,26px)/1.1 var(--f-display);letter-spacing:.01em;margin:0}
.brandrow{display:flex;align-items:center;gap:14px}.brandrow img{height:42px;width:auto;display:block}
.subt{font:500 12px var(--f-mono);color:var(--mute);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font:500 12px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
a{color:var(--accent-text)}
.btn.primary,.btn.primary:hover{color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px}
.panel h2{font:700 17px/1.2 var(--f-display);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
label.f{display:block;min-width:0}
label.f>span{display:block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.gate{max-width:420px;margin:8vh auto 0}
.msg{padding:10px 12px;border-radius:6px;margin:12px 0;background:var(--bad-bg);color:var(--bad);font-weight:500}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.stats{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:18px 0 10px;padding-bottom:6px}
.stat{flex:0 0 auto;min-width:132px;scroll-snap-align:start;text-align:left;cursor:pointer;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.stat .n,.stat .l{display:block}
.stat .n{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:4px}
.stat.main{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:inset 0 -5px 0 var(--gold)}
.stat.main .l{color:#fff;opacity:.9}
.ics{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin-bottom:14px;padding-bottom:6px}
.ic{flex:0 0 auto;scroll-snap-align:start;font:inherit;color:inherit;display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer}
.ic[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.ic b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ic span{font:500 12px var(--f-mono);color:var(--mute)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toolbar input[type=search]{flex:1 1 200px}
.toolbar select{width:auto}
.person{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-width:0}
.person:hover{border-color:var(--ink)}
.av{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:700 20px var(--f-display);color:var(--mute);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av[data-a="zoom"]{cursor:zoom-in}
.zoombg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.zoombox{max-width:96vw;max-height:80vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:6px;background:#000}
.zoombox img{display:block;max-width:96vw;max-height:80vh;width:auto;height:auto;cursor:zoom-in;margin:0 auto}
.zoombox.big img{max-width:none;max-height:none;width:200vw;cursor:zoom-out}
.zoomcap{color:#fff;font-weight:600;margin:10px 0 8px;text-align:center}
.zoomhint{color:#cfd8d3;font:12px var(--f-mono);margin-bottom:10px;text-align:center}
.av.big{width:96px;height:96px;font-size:34px}
.pinfo{flex:1 1 auto;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.pos{color:var(--mute);font-size:12.5px}
.meta{font:500 12px var(--f-mono);color:var(--mute);margin-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:500 11.5px var(--f-mono);white-space:nowrap}
.pill.onsite{background:var(--ok-bg);color:var(--ok)}
.pill.left{background:var(--off-bg);color:var(--off)}
.pill.sent{background:rgba(255,198,0,.25);color:inherit}
.ic small{font:500 11px var(--f-mono);color:var(--mute)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:6px;align-items:center;flex:none}
.ico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--ink);text-decoration:none;font:600 11px var(--f-mono)}
.ico:hover{border-color:var(--ink)}
.ico svg{width:19px;height:19px}
.ico.wa{border-color:var(--wa)}
.ico.wa svg{fill:var(--wa)}
.ico.off{opacity:.35;pointer-events:none}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}
.note{color:var(--mute);font-size:12.5px}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}
.head h2{font:800 26px/1.1 var(--f-display);margin:0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding-bottom:12px}
.tl .it::before{content:"";position:absolute;left:-23px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl b{display:block}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
dl.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.bio dt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
dl.bio dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap}
.soon{border-style:dashed;color:var(--mute)}
.ico.cr{border-color:var(--gold)}.ico.cr svg{fill:none;stroke:#b98a00;stroke-width:1.8}
.modal-bg{position:fixed;inset:0;background:rgba(34,30,31,.6);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:18px;width:100%;max-width:380px;border-top:5px solid var(--bad)}
.modal h3{margin:0 0 6px;font-size:17px}

.c-t1{top:136px;left:0;right:0;text-align:center;font:700 56px/1 "CertSans",Arial,Helvetica,sans-serif;letter-spacing:.05em}
.c-tab{left:35px;top:200px;width:117px;height:35px;background:#ffc600}
.c-line{left:152px;right:34px;top:200px;height:2px;background:#221e1f}
.c-t2{top:250px;left:0;right:0;text-align:center;white-space:pre;font-size:21px;letter-spacing:.12em;font-weight:400}
.c-co{top:306px;left:0;right:0;text-align:center;color:#44a276;font-size:22px;letter-spacing:.14em;font-weight:400}
.c-body{top:346px;left:86px;right:86px;height:364px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;font-size:15px;line-height:1.55;gap:10px;overflow:hidden}
.c-name{font:700 36px/1.15 "CertSans",Arial,sans-serif;color:#44a276;border-bottom:2px solid #ffc600;padding:0 14px 6px}
.c-id{font-size:13px;letter-spacing:.04em;color:#44494a;margin-top:-6px}
.c-para{max-width:590px;font-size:14.5px;line-height:1.65;margin-top:2px}
.c-place{font-weight:700;margin-top:-4px}
.c-det{white-space:pre-line;font-size:14px;color:#44494a;margin-top:-4px}
.c-pts{margin:0;padding:0 0 0 22px;text-align:left;max-width:560px;font-size:14px;line-height:1.5}
.c-pts li{margin-bottom:4px}
.c-note{left:64px;right:150px;top:874px;text-align:center;font-size:9px;line-height:1.35;font-style:italic;color:#5a5f60}
.c-qr{left:562px;top:938px;width:72px;height:72px}.c-qr svg{width:72px;height:72px;display:block}
.c-vf{left:292px;right:244px;top:1008px;text-align:left;font-size:8px;line-height:1.35;color:#44494a}.c-vf b{font-family:monospace;font-size:9.5px;letter-spacing:.04em;color:#221e1f}
.c-thx{font-style:italic;font-weight:700;margin-top:6px}
.c-dots{left:651px;top:851px;width:88px;display:grid;grid-template-columns:repeat(5,7px);justify-content:space-between;row-gap:10px}
.c-dots i{width:7px;height:7px;border-radius:50%;background:#a7a9ac;display:block}
.c-sq{left:651px;top:940px;width:88px;height:88px;background:#ffc600}
.c-sigrow{left:40px;right:40px;top:712px;height:140px;display:flex;justify-content:space-between}
.c-sg{position:relative;width:228px;height:140px;text-align:center}
.c-sg .c-sl{position:absolute;left:14px;right:14px;top:74px;height:1px;background:#44a276}
.c-sg b{position:absolute;left:0;right:0;top:82px;font-size:12.5px;letter-spacing:.03em;white-space:nowrap}
.c-sg i{position:absolute;left:0;right:0;top:102px;font-size:11px;white-space:nowrap;color:#44494a}
.c-sign{position:absolute;left:50%;transform:translateX(-50%) rotate(9deg);top:6px;height:108px;width:auto;object-fit:contain;z-index:3}
.c-sign.rida{transform:translateX(-50%) rotate(0deg);top:20px;height:82px}
.c-iss{left:0;right:0;top:850px;text-align:center;font-size:11.5px;color:#44494a}
.cert>img.c-stamp{position:absolute;left:56px;top:904px;height:100px;width:100px}
.c-shell{left:48px;top:1006px;display:flex;align-items:center;gap:7px;font-size:13px;color:#221e1f;white-space:nowrap}.c-shell img{height:25px;width:auto;display:block}
.c-fl{left:282px;right:45px;top:1056px;height:1px;background:#221e1f}
.c-fb{left:48px;top:1044px;width:234px;height:26px;background:#44a276;color:#fff;font-size:13px;font-weight:700;letter-spacing:.07em;line-height:26px;padding-left:14px}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  .noprint,header.top,#toastbox{display:none!important}
  .wrap{max-width:none!important}
  .certwrap{height:1120px!important;margin:0!important;max-width:none!important;width:794px!important;page-break-after:avoid}
  .cert{transform:none!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.stk{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:0 16px;box-shadow:0 6px 8px -8px rgba(0,0,0,.35)}
.stk header.top{padding:10px 0 8px}
.stk .stats{margin:10px 0 6px;padding-bottom:2px}
.stk .toolbar{margin-bottom:8px}
@media (max-width:560px){.stk .subt{display:none}.brandrow img{height:30px}.stk .stat{min-width:96px;padding:7px 10px}.stk .stat .n{font-size:26px}.stk .stat .l{font-size:10px}.stk .msg{margin:6px 0}}
@media print{.stk{position:static;box-shadow:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:9;max-width:90vw;font-weight:500}
@media (max-width:560px){.person{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end}}
</style>

const TR={};const S={rem:false,f:"",wa:null,ed:null,trOn:false,trBusy:false,key:"",people:[],photos:{},view:"gate",id:null,q:"",ic:"",st:"",pr:"",busy:false,msg:null,ok:false,arm:false,draft:null,cert:null,del:null};

/* ---------- helpers ---------- */
const posName=p=>p.position==="Other"?(p.positionOther||"Other"):(p.position||"");
const projName=p=>p.project==="Other"?(p.projectOther||"Other"):(p.project||"");
const icName=p=>p.contractor==="Other"?(p.contractorOther||"Other"):(p.contractor||"");
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
function dFmt(iso){if(!iso)return"—";const d=new Date(iso+"T00:00:00");return isNaN(d)?"—":d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"short",year:"numeric"})}
function mFmt(m){if(!m)return"";const d=new Date(m+"-01T00:00:00");return isNaN(d)?m:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{month:"short",year:"numeric"})}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tenure(p){
  if(!p.startDate)return"—";
  const a=new Date(p.startDate+"T00:00:00"),b=new Date(((p.status==="left"&&p.endDate)?p.endDate:todayISO())+"T00:00:00");
  if(isNaN(a)||isNaN(b)||b<a)return"—";
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  if(!y&&!m)return Math.round((b-a)/864e5)+1+" "+t("days");
  return (y?y+" "+t("yr")+" ":"")+(m?m+" "+t("mo"):"");
}
function waNumber(phone){
  let d=String(phone||"").replace(/\D/g,"");
  if(!d)return"";
  if(d.startsWith("00"))d=d.slice(2);else if(d.startsWith("0"))d=DEFAULT_CC+d.slice(1);
  return d.length>=8?d:"";
}
function waIcon(p,label){
  const nums=[p.phone,p.phone2].map(waNumber).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
  const svg=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${WA_PATH}"/></svg>`;
  if(!nums.length)return `<span class="ico wa off" title="${esc(t("nonum"))}">${svg}</span>`;
  if(nums.length===1)return `<a class="ico wa" href="https://wa.me/${nums[0]}" target="_blank" rel="noopener" title="${esc(t("wa"))}: +${nums[0]}" aria-label="${esc(label||t("wa"))}" data-stop="1">${svg}</a>`;
  return `<a class="ico wa" href="#" role="button" data-a="waPick" data-id="${esc(p.id)}" title="${esc(t("waPick"))}" aria-label="${esc(label||t("wa"))}">${svg}</a>`;
}
function waModal(){

  return `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal" style="border-top-color:var(--accent)"><h3>${esc(t("waPick"))}</h3><div style="font-weight:600">${esc(p.name||"")}</div>${row(t("num1"),p.phone)}${row(t("num2"),p.phone2)}<div style="margin-top:12px"><button class="btn small" data-a="waClose">${esc(t("close"))}</button></div></div></div>`;
}
const AWARD_PATH="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 14l-1.5 7 5-3 5 3-1.5-7";
function certIcon(id){const q=S.people.find(x=>x.id===id),ok=q&&q.endDate;return `<a class="ico cr" style="${ok?"":"opacity:.4"}" href="#" role="button" data-a="certOpen" data-id="${esc(id)}" title="${esc(t("mkCert"))}" aria-label="${esc(t("mkCert"))}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${AWARD_PATH}"/></svg></a>`}
/* LinkedIn: open the person's Recommendations page (from there use Recommend / More > Recommend) */
function liRec(u){const m=/linkedin\.com\/in\/([^\/?#]+)/i.exec(u||"");return m?"https://www.linkedin.com/in/"+m[1]+"/details/recommendations/":safeUrl(u)}
const ktp4=v=>String(v||"").replace(/\D/g,"").slice(-4);
const maskKtp=v=>{const d=ktp4(v);return d?"XXXX XXXX XXXX "+d:""};
function missingP(p){
  const m=[],e=v=>!String(v||"").trim();
  if(e(p.name))m.push(t("nmL"));
  if(e(posName(p)))m.push(t("posL"));
  if(e(icName(p)))m.push(t("icL"));
  if(e(projName(p)))m.push(t("project"));
  if(e(p.startDate))m.push(t("join"));
  if(ktp4(p.ktp).length!==4)m.push(t("ktp"));
  if(e(p.phone))m.push(t("phL"));
  if(e(p.linkedin))m.push(t("li"));
  if(!p.hasPhoto)m.push(t("phoL"));
  if(!p.cvUrl)m.push(t("cv"));
  if(e(p.about))m.push(t("about"));
  if(e(p.qualifications))m.push(t("quals"));
  if(e(p.dob))m.push(t("dob"));
  if(e(p.nationality))m.push(t("nat"));
  if(e(p.city))m.push(t("city"));
  if(e(p.languages))m.push(t("lang"));
  if(e(p.emergencyName)||e(p.emergencyPhone))m.push(t("emg"));
  if(!(p.experience||[]).length)m.push(t("exp"));
  if(!(p.education||[]).length)m.push(t("edu"));
  const c=p.certs||[];
  if(!c.length)m.push(t("certs"));else if(c.some(x=>!x.url))m.push(t("certs")+" ("+t("cv")+")");
  return m;
}
function toast(m){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=m;document.getElementById("toastbox").replaceChildren(el);setTimeout(()=>el.remove(),3000)}
function avatar(p,big){const ph=S.photos[p.id];return `<div class="av${big?" big":""}" data-ph="${esc(p.id)}"${ph?' data-a="zoom" role="button" tabindex="0"':""} data-zid="${esc(p.id)}">${ph?`<img src="${esc(ph)}" alt="">`:esc(initials(p.name))}</div>`}

/* ---------- api ---------- */

const trKey=s=>lang+"|"+s;
const TT=s=>(S.trOn&&s&&TR[trKey(s)])||s;
function trStrings(p){const a=[p.about,p.qualifications];(p.experience||[]).forEach(x=>{a.push(x.title,x.description)});(p.certs||[]).forEach(x=>a.push(x.title));(p.education||[]).forEach(x=>a.push(x.degree));return [...new Set(a.filter(x=>x&&x.trim()))]}
async function doTranslate(){
  const p=S.people.find(x=>x.id===S.id);if(!p||!S.trOn)return;
  const need=trStrings(p).filter(s=>!TR[trKey(s)]);if(!need.length){render();return}
  S.trBusy=true;render();
  try{const r=await api({action:"adminTranslate",texts:need,target:lang});
    if(r.ok)need.forEach((s,i)=>{TR[trKey(s)]=r.texts[i]||s});
    else{S.msg=r.error==="bad_key"?t("bk"):t("srv");S.ok=false}
  }catch(e){S.msg=t("srv");S.ok=false}
  S.trBusy=false;render();
}
async function api(body){
  if(!API||API.startsWith("PASTE_"))throw new Error("nosetup");
  const r=await fetch(API,{method:"POST",body:JSON.stringify({...body,key:S.key})});
  return r.json();
}
async function load(){
  S.busy=true;S.msg=null;render();
  try{
    const r=await api({action:"adminList"});
    if(r.ok){S.people=r.people;S.view=S.view==="gate"?"list":S.view;try{sessionStorage.setItem("icadm-key",S.key);if(S.rem)localStorage.setItem("icadm-keep",S.key);else localStorage.removeItem("icadm-keep")}catch(e){}loadPhotos()}
    else{S.msg=r.error==="bad_key"?t("bk"):r.error==="locked"?t("lk"):t("srv");S.view="gate";try{sessionStorage.removeItem("icadm-key");localStorage.removeItem("icadm-keep")}catch(e){}}
  }catch(e){S.msg=e&&e.message==="nosetup"?t("nosetup"):t("srv");S.view="gate"}
  S.busy=false;render();
}
async function loadPhotos(){
  const todo=S.people.filter(p=>p.hasPhoto&&!S.photos[p.id]);
  let i=0;
  async function worker(){
    while(i<todo.length){
      const p=todo[i++];
      try{const r=await api({action:"adminPhoto",id:p.id});if(r.ok&&r.photo){S.photos[p.id]=r.photo;document.querySelectorAll('[data-ph="'+p.id+'"]').forEach(el=>{el.innerHTML=`<img src="${esc(r.photo)}" alt="">`;el.setAttribute("data-a","zoom");el.setAttribute("role","button")})}}catch(e){}
    }
  }
  await Promise.all([worker(),worker()]);
}

function projects(){return [...new Set(S.people.map(projName).filter(Boolean))].sort()}
function list(){
  const on=S.people.filter(p=>p.status!=="left"),left=S.people.filter(p=>p.status==="left");
  const by=k=>on.filter(p=>k==="Other"?!ICS.includes(p.contractor):p.contractor===k).length;
  const q=S.q.trim().toLowerCase();
  const rows=S.people.filter(p=>{
    if(S.st&&(p.status||"onsite")!==S.st)return false;
    if(S.pr&&projName(p)!==S.pr)return false;
    if(S.f==="nocv"&&(p.status==="left"||p.cvUrl))return false;
    if(S.f==="inc"&&!missingP(p).length)return false;
    if(S.ic){if(S.ic==="Other"){if(ICS.includes(p.contractor))return false}else if(p.contractor!==S.ic)return false}
    return !q||((p.name||"")+" "+posName(p)+" "+icName(p)).toLowerCase().includes(q);
  }).sort((a,b)=>((a.status==="left")-(b.status==="left"))||(a.name||"").localeCompare(b.name||""));
  const tot=k=>S.people.filter(p=>k==="Other"?!ICS.includes(p.contractor):p.contractor===k).length;
  const icb=k=>`<button class="ic" data-a="ic" data-v="${k}" aria-pressed="${S.ic===k}"><b>${by(k)}</b><span>${k}</span><small>/ ${tot(k)} ${esc(t("tot"))}</small></button>`;
  const noCv=on.filter(p=>!p.cvUrl).length,inc=S.people.filter(p=>missingP(p).length).length;
  const sb=(v,n,l,extra,cls)=>`<button class="stat ${cls||""}" data-a="stf" data-v="${v}" aria-pressed="${v==="all"?(!S.st&&!S.f&&!S.ic):(v==="onsite"||v==="left")?S.st===v&&!S.f:S.f===v}"><span class="n" style="${extra||""}">${n}</span><span class="l">${esc(l)}</span></button>`;
  let h=msg()+`<div class="stats">${sb("onsite",on.length,t("onsite"),"","main")}${sb("left",left.length,t("left"))}${sb("nocv",noCv,t("nocv"),noCv?"color:var(--bad)":"")}${sb("inc",inc,t("incN"),inc?"color:var(--bad)":"")}${sb("all",S.people.length,t("total"))}</div>
   <div class="ics"><button class="ic" data-a="ic" data-v="" aria-pressed="${!S.ic}"><b>${S.people.length}</b><span>${esc(t("stfAll"))}</span><small>${on.length} ${esc(t("onsite"))}</small></button>${ICS.map(icb).join("")}${tot("Other")?icb("Other"):""}</div>
   <div class="toolbar"><input type="search" id="q" placeholder="${esc(t("search"))}" value="${esc(S.q)}" aria-label="${esc(t("search"))}">
   <select id="stSel"><option value="">${esc(t("allSt"))}</option><option value="onsite"${S.st==="onsite"?" selected":""}>${esc(t("stOn"))}</option><option value="left"${S.st==="left"?" selected":""}>${esc(t("stLeft"))}</option></select>
   ${projects().length>1?`<select id="prSel"><option value="">${esc(t("allPr"))}</option>${projects().map(x=>`<option${S.pr===x?" selected":""}>${esc(x)}</option>`).join("")}</select>`:""}
   ${S.ic?`<button class="btn small" data-a="ic" data-v="">${esc(S.ic)} ✕</button>`:""}${S.f?`<button class="btn small" data-a="stf" data-v="all">${esc(S.f==="nocv"?t("nocv"):t("incN"))} ✕</button>`:""}</div><!--ENDHEAD-->`;
  if(!rows.length)return h+`<div class="panel empty">${esc(t("none"))}</div>`;
  for(const p of rows){
    h+=`<div class="person" data-a="open1" data-id="${esc(p.id)}" tabindex="0">${avatar(p)}<div class="pinfo"><div class="nm">${esc(p.name||"—")}</div><div class="pos">${esc([posName(p),icName(p),projName(p)].filter(Boolean).join(" · "))}</div>
    <div class="meta">${esc(t("joined"))} ${esc(dFmt(p.startDate))} · ${esc(tenure(p))}</div></div>
    ${missingP(p).length?`<span class="pill bad" title="${esc(missingP(p).join(", "))}">${esc(t("inc"))} (${missingP(p).length})</span>`:""}${p.certRevokedAt?`<span class="pill bad">${esc(t("revoked"))}</span>`:""}${p.certSentAt?`<span class="pill sent" title="${esc(dFmt(String(p.certSentAt).slice(0,10)))}">✓ ${esc(t("certSentL"))}</span>`:""}<span class="pill ${p.status==="left"?"left":"onsite"}">${esc(p.status==="left"?t("stLeft"):t("stOn"))}</span>
    <div class="acts">${certIcon(p.id)}${waIcon(p,t("wa")+" "+p.name)}${p.cvUrl?`<a class="ico" href="${esc(safeUrl(p.cvUrl))}" target="_blank" rel="noopener" title="${esc(t("cv"))}" data-stop="1">CV</a>`:`<span class="pill bad">${esc(t("noCv"))}</span>`}</div></div>`;
  }

   <div class="links" style="margin-top:8px"><button class="btn small primary" style="${p.endDate?"":"opacity:.5"}" data-a="certOpen" data-id="${esc(p.id)}">★ ${esc(t("mkCert"))}</button>${waIcon(p,t("wa"))}${p.email?`<a class="btn small" href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:""}${p.phone?`<span class="btn small" style="cursor:text">${esc(p.phone)}</span>`:""}${p.phone2?`<span class="btn small" style="cursor:text">${esc(p.phone2)}</span>`:""}<button class="btn small" data-a="editOpen">✎ ${esc(t("editB"))}</button>${safeUrl(p.linkedin)?`<a class="btn small" href="${esc(liRec(p.linkedin))}" target="_blank" rel="noopener">${esc(t("liRec"))}</a><a class="btn small" href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener">${esc(t("liProf"))}</a>`:""}${p.cvUrl?`<a class="btn small" href="${esc(safeUrl(p.cvUrl))}" target="_blank" rel="noopener">${esc(t("cv"))} ↗</a>`:""}${p.folderUrl?`<a class="btn small" href="${esc(safeUrl(p.folderUrl))}" target="_blank" rel="noopener">${esc(t("folder"))} ↗</a>`:""}</div></div></div>
  <div class="panel"><h2>${esc(t("adminT"))}</h2><div class="grid">
   <label class="f"><span>${esc(t("status"))}</span><select data-f="status"><option value="onsite"${d.status!=="left"?" selected":""}>${esc(t("stOn"))}</option><option value="left"${d.status==="left"?" selected":""}>${esc(t("stLeft"))}</option></select></label>

   <label class="f"><span>${esc(t("end"))}</span><input type="date" data-f="endDate" value="${esc(d.endDate)}"></label>

  <div class="panel"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn small" data-a="trToggle"${S.trBusy?" disabled":""}>🌐 ${esc(S.trBusy?t("trBusy"):(S.trOn?t("trOff"):t("trB")))}</button>${S.trOn?`<span class="note">${esc(t("trNote"))}</span>`:""}</div></div>
  ${sec(t("about"),(p.about?`<div class="pre">${esc(TT(p.about))}</div>`:"")+(p.qualifications?`<div class="pre note" style="margin-top:8px">${esc(TT(p.qualifications))}</div>`:""))}

const CT = {
 en:{cert:"CERTIFICATE",of:"OF APPRECIATION",presented:"This certificate is proudly presented to",
  service:(p)=>`in sincere appreciation of dedicated HSSE service on the EcoOils ${p.project} Project`,
  place:"PT EcoOils Jaya Indonesia, Simalungun",idl:"KTP / Identification No.",
  detail:(p)=>[p.pos,p.ic?`Employed by: ${p.ic} (Implementation Contractor)`:"",[p.from?`Period on the Project: ${p.from} to ${p.to}`:"",p.ten?`(${p.ten})`:""].filter(Boolean).join(" ")].filter(Boolean).join("\n"),
  note:"This is a Certificate of Appreciation only. The holder was not a direct employee of PT EcoOils Jaya Indonesia and served on the Project as HSSE personnel employed by the Implementation Contractor named above. It is not an employment or experience letter.",
  vf:(no,u)=>`Certificate No. <b>${no}</b><br>To verify this certificate, scan the QR code. If it cannot be verified, please verify with EcoOils.`,
  inpart:"In particular, we appreciate:",thanks:"Thank you for your commitment to the safety of everyone on site.",
  subj:(p)=>`Certificate of Appreciation – ${p.name}, ${p.project} Project`,
  wa:(p)=>`Hello ${p.first}, please find attached your Certificate of Appreciation (No. ${p.no}) for your HSSE service on the ${p.project} Project. This certificate is not an employment letter; you served with ${p.ic}. To verify it, scan the QR code on the certificate. Thank you for your commitment to the safety of everyone on site. – Iggy, HSSE Manager, PT EcoOils Jaya Indonesia`,
  mail:(p,pts)=>`Dear ${p.first},\n\nOn behalf of PT EcoOils Jaya Indonesia, thank you for your dedicated HSSE service and engagement on the EcoOils ${p.project} Project${p.pos?` as ${p.pos}`:""}${p.ic?` with ${p.ic}, an Implementation Contractor on the Project`:""}.${p.from?` You served from ${p.from} to ${p.to}`:""}${p.ten?` – ${p.ten} on the project`:""}${p.from?".":""}\n\n${pts.length?"In particular, we appreciate:\n"+pts.map(x=>"• "+x).join("\n")+"\n\n":""}Please find attached your Certificate of Appreciation. Thank you for your commitment to the safety of everyone on site, and we wish you every success in your next assignment.\n\nPlease note: this is a Certificate of Appreciation only. You were not a direct employee of PT EcoOils Jaya Indonesia; you served on the Project as HSSE personnel employed by the Implementation Contractor named above. It is not an employment or experience letter.${p.no?`\n\nCertificate No. ${p.no}. To verify it, scan the QR code on the certificate. If it cannot be verified, please verify with EcoOils.`:""}\n\nBest regards,\n\n${SIGNER_NAME}\n${SIGNER_TITLE.en}, ${p.project} Project\nPT EcoOils Jaya Indonesia`,
  y:["year","years"],m:["month","months"],d:["day","days"]},
 id:{cert:"SERTIFIKAT",of:"PENGHARGAAN",presented:"Sertifikat ini dengan bangga diberikan kepada",
  service:(p)=>`sebagai apresiasi tulus atas dedikasi layanan HSSE pada Proyek EcoOils ${p.project}`,
  place:"PT EcoOils Jaya Indonesia, Simalungun",idl:"No. KTP / Identitas",
  detail:(p)=>[p.pos,p.ic?`Dipekerjakan oleh: ${p.ic} (Kontraktor Pelaksana)`:"",[p.from?`Periode di Proyek: ${p.from} hingga ${p.to}`:"",p.ten?`(${p.ten})`:""].filter(Boolean).join(" ")].filter(Boolean).join("\n"),
  note:"Ini hanyalah Sertifikat Penghargaan. Pemegang sertifikat bukan karyawan langsung PT EcoOils Jaya Indonesia dan bertugas di Proyek sebagai personel HSSE yang dipekerjakan oleh Kontraktor Pelaksana yang disebutkan di atas. Dokumen ini bukan surat keterangan kerja atau pengalaman.",
  vf:(no,u)=>`No. Sertifikat <b>${no}</b><br>Untuk memverifikasi sertifikat ini, pindai kode QR. Jika tidak dapat diverifikasi, mohon verifikasi dengan EcoOils.`,
  inpart:"Dengan apresiasi khusus atas:",thanks:"Terima kasih atas komitmen Anda terhadap keselamatan seluruh orang di lokasi proyek.",

function dLong(iso,L){if(!iso)return"";const d=new Date(iso+"T00:00:00");return isNaN(d)?"":d.toLocaleDateString(L==="id"?"id-ID":"en-GB",{day:"numeric",month:"long",year:"numeric"})}
function tenureLong(startISO,endISO,L){
  if(!startISO)return"";
  const a=new Date(startISO+"T00:00:00"),b=new Date(endISO+"T00:00:00");
  if(isNaN(a)||isNaN(b)||b<a)return"";
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  const u=CT[L],w=[];
  if(y)w.push(y+" "+u.y[y>1?1:0]);
  if(m)w.push(m+" "+u.m[m>1?1:0]);
  if(!y&&!m){const n=Math.round((b-a)/864e5)+1;w.push(n+" "+u.d[n>1?1:0])}
  return w.join(L==="id"?" ":" and ");
}
function summaryToPoints(txt){
  return String(txt||"").replace(/([.;!?])\s+/g,"$1\n").split(/\n+/)
    .map(x=>x.replace(/^\s*([-–•*·]|\d+[.)])\s+/,"").trim()).filter(Boolean).slice(0,6)
    .map(x=>{x=x.replace(/[;,:\s]+$/,"");x=x.charAt(0).toUpperCase()+x.slice(1);return /[.!?]$/.test(x)?x:x+"."}).filter(x=>x.length>1);
}

async function certPdfBlob(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");

  const cl=src.cloneNode(true);cl.style.transform="none";cl.style.boxShadow="none";host.appendChild(cl);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const hi=Math.min(window.innerWidth,screen.width||9999)>=900;const cv=await html2canvas(cl,{scale:hi?4:3,backgroundColor:"#ffffff",width:794,height:1120,windowWidth:794,logging:false});

}

  else if(a==="waClose"){S.wa=null;render()}
  else if(a==="stf"){const v=el.dataset.v;if(v==="all"){S.st="";S.f="";S.ic=""}else if(v==="onsite"||v==="left"){S.st=S.st===v&&!S.f?"":v;S.f=""}else{S.f=S.f===v?"":v}render();jump()}
  else if(a==="editOpen"){const p=S.people.find(x=>x.id===S.id);if(p){S.ed={};EDF.forEach(k=>S.ed[k]=k==="ktp"?ktp4(p.ktp):(p[k]||""));if(!S.ed.position)S.ed.position=POSITIONS[0];if(!S.ed.contractor)S.ed.contractor="GSB";S.view="edit";S.msg=null;render();window.scrollTo(0,0)}}
  else if(a==="editCancel"){S.view="detail";S.ed=null;S.msg=null;render()}
  else if(a==="editSave"){
    S.busy=true;render();
    try{const r=await api({action:"adminUpdate",id:S.id,fields:{profile:S.ed}});
      if(r.ok){S.people=S.people.map(p=>p.id===S.id?r.person:p);S.draft={status:r.person.status||"onsite",startDate:r.person.startDate||"",endDate:r.person.endDate||"",adminNotes:r.person.adminNotes||""};S.view="detail";S.ed=null;S.msg=t("edSaved");S.ok=true}
      else{S.msg=r.error==="bad_key"?t("bk"):t("srv");S.ok=false}
    }catch(_){S.msg=t("srv");S.ok=false}
    S.busy=false;render();window.scrollTo(0,0);
  }
  else if(a==="certSent"){
    const p=S.people.find(x=>x.id===S.id);if(!p)return;
    S.busy=true;render();
    try{const r=await api({action:"adminUpdate",id:S.id,fields:{certSent:!p.certSentAt}});
      if(r.ok){S.people=S.people.map(x=>x.id===S.id?r.person:x);S.msg=r.person.certSentAt?t("certSentL"):t("saved");S.ok=true}
      else{S.msg=t("srv");S.ok=false}
    }catch(_){S.msg=t("srv");S.ok=false}
    S.busy=false;render();
  }
  else if(a==="back"){S.view="list";S.id=null;S.msg=null;render()}
  else if(a==="certOpen"){const p=S.people.find(x=>x.id===el.dataset.id);
    if(p&&(!p.endDate||(p.startDate&&p.endDate<p.startDate))){S.msg=(p.name||"")+": "+(p.endDate?t("badEnd"):t("noEnd"));S.ok=false;render();window.scrollTo(0,0);return}
    if(p){S.id=p.id;S.cert=newCert(p);S.view="cert";S.msg=null;render();window.scrollTo(0,0)}}
  else if(a==="certBack"){if(S.cert.step===2){S.cert.step=1;render()}else{S.view="detail";S.cert=null;const p=S.people.find(x=>x.id===S.id);S.draft={status:p.status||"onsite",startDate:p.startDate||"",endDate:p.endDate||"",adminNotes:p.adminNotes||""};render()}window.scrollTo(0,0)}
  else if(a==="cLang"){S.cert.lang=el.dataset.v;S.cert.paraEdited=false;S.cert.para=pointsToPara(S.cert.points);S.cLangPref=el.dataset.v;S.cert.edited=false;render()}
  else if(a==="cMake"){const c=S.cert;c.summary=(document.getElementById("cSum")||{value:c.summary}).value;c.points=summaryToPoints(c.summary).join("\n");c.para=pointsToPara(c.points);c.paraEdited=false;c.edited=false;c.step=2;render();window.scrollTo(0,0);const ok=await certIssue();if(!ok){S.msg=t("noIssue");S.ok=false}else{const p=S.people.find(x=>x.id===S.id);if(p&&!c.edited){const m=emailFor(p,c);c.subject=m.subject;c.body=m.body}}render()}
  else if(a==="cCopyBody"){toast(await copyText(document.getElementById("emBody").value)?t("copied"):"—")}
  else if(a==="cCopySub"){toast(await copyText(document.getElementById("emSub").value)?t("copied"):"—")}
  else if(a==="cResetMail"){S.cert.edited=false;render()}
  else if(a==="cMail"){const p=S.people.find(x=>x.id===S.id);const u="mailto:"+encodeURIComponent(p.email||"")+"?subject="+encodeURIComponent(document.getElementById("emSub").value)+"&body="+encodeURIComponent(document.getElementById("emBody").value);window.location.href=u}
  else if(a==="cWa"){if(S.busy)return;S.busy=true;render();try{await certWhatsApp()}finally{S.busy=false;render()}}
  else if(a==="cPrint"){const ok=await certIssue();if(!ok){S.msg=t("noIssue");S.ok=false;render();return}const p=S.people.find(x=>x.id===S.id);if(p&&!S.cert.edited){const m=emailFor(p,S.cert);S.cert.subject=m.subject;S.cert.body=m.body}render();setTimeout(()=>{const old=document.title,pp=S.people.find(x=>x.id===S.id);document.title=certFileName(pp,S.cert);const back=()=>{document.title=old;window.removeEventListener("afterprint",back)};window.addEventListener("afterprint",back);window.print();setTimeout(back,60000)},150)}
  else if(a==="certRevoke"){const p=S.people.find(x=>x.id===S.id);if(!p||!p.certNo)return;S.busy=true;render();try{const r=await api({action:"adminCertRevoke",id:p.id,revoke:!p.certRevokedAt});if(r.ok){S.people=S.people.map(x=>x.id===p.id?r.person:x);S.msg=r.person.certRevokedAt?t("revoked"):t("restored");S.ok=true}else{S.msg=t("srv");S.ok=false}}catch(_){S.msg=t("srv");S.ok=false}S.busy=false;render()}
  else if(a==="delAsk"){S.del={id:S.id,code:"",err:"",busy:false};render();const i=document.getElementById("delCode");if(i)i.focus()}
  else if(a==="delNo"){S.del=null;render()}
  else if(a==="delGo"){
    const d=S.del;d.code=(document.getElementById("delCode")||{value:d.code}).value;d.busy=true;d.err="";render();
    try{
      const r=await api({action:"adminDelete",id:d.id,code:d.code});
      if(r.ok){S.people=S.people.filter(x=>x.id!==d.id);S.del=null;S.view="list";S.id=null;S.msg=t("deleted");S.ok=true}
      else{d.busy=false;d.err=r.error==="bad_code"?t("badCode"):t("srv")}
    }catch(_){d.busy=false;d.err=t("srv")}
    render();const i=document.getElementById("delCode");if(i&&S.del)i.focus();
  }
  else if(a==="saveAdmin"){
    const d=S.draft;
    S.busy=true;render();
    try{const r=await api({action:"adminUpdate",id:S.id,fields:d});if(r.ok){S.people=S.people.map(p=>p.id===S.id?r.person:p);S.draft={status:r.person.status||"onsite",startDate:r.person.startDate||"",endDate:r.person.endDate||"",adminNotes:r.person.adminNotes||""};S.msg=t("saved");S.ok=true}else{S.msg=t("srv");S.ok=false}}
    catch(_){S.msg=t("srv");S.ok=false}
    S.busy=false;render();
  }
  else if(a==="reset"){
    if(!S.arm){S.arm=true;render();setTimeout(()=>{if(S.arm){S.arm=false;if(S.view==="detail")render()}},4000);return}
    S.arm=false;
    try{const r=await api({action:"adminResetPin",id:S.id});if(r.ok){S.people=S.people.map(p=>p.id===S.id?r.person:p);S.msg=t("resetDone");S.ok=true}else{S.msg=t("srv");S.ok=false}}catch(_){S.msg=t("srv");S.ok=false}
    render();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".person"))e.target.click();
  if(e.key==="Enter"&&e.target.id==="keyIn"){S.key=e.target.value;load()}
  if(e.key==="Enter"&&e.target.id==="delCode"){const b=document.querySelector('[data-a="delGo"]');if(b)b.click()}
  if(e.key==="Escape"&&S.del){S.del=null;render()}
  if(e.key==="Escape"&&S.zoom){S.zoom=null;render()}else if(e.key==="Escape"&&S.wa){S.wa=null;render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){S.q=el.value;const pos=el.selectionStart;render();const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(pos,pos)}}
  else if(el.id==="delCode"&&S.del){S.del.code=el.value}
  else if(el.id==="cSum"&&S.cert){S.cert.summary=el.value}
  else if(el.id==="cPts"&&S.cert){
    const c=S.cert;c.points=el.value;
    if(!c.paraEdited){c.para=pointsToPara(c.points);document.getElementById("cPara").value=c.para}
    if(!c.edited){const p=S.people.find(x=>x.id===S.id),m=emailFor(p,c);document.getElementById("emSub").value=m.subject;document.getElementById("emBody").value=m.body}
    certRefresh();
  }
  else if(el.id==="cPara"&&S.cert){S.cert.para=el.value;S.cert.paraEdited=true;certRefresh()}
  else if(el.id==="emSub"&&S.cert){S.cert.edited=true;S.cert.subject=el.value;S.cert.body=document.getElementById("emBody").value}
  else if(el.id==="emBody"&&S.cert){S.cert.edited=true;S.cert.subject=document.getElementById("emSub").value;S.cert.body=el.value}
  else if(el.dataset.e&&S.ed&&!el.dataset.er){S.ed[el.dataset.e]=el.dataset.e==="ktp"?(el.value=el.value.replace(/\D/g,"").slice(0,4)):el.value}
  else if(el.dataset.f&&S.draft){S.draft[el.dataset.f]=el.value}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="stSel"){S.st=el.value;render()}
  else if(el.id==="prSel"){S.pr=el.value;render()}
  else if(el.id==="cDate"&&S.cert){S.cert.date=el.value||todayISO();S.cert.edited=false;if(S.cert.step===2)render()}
  else if(el.dataset.er&&S.ed){S.ed[el.dataset.e]=el.value;render()}
  else if(el.dataset.f==="status"&&S.draft){S.draft.status=el.value;render()}
  else if(el.dataset.f&&S.draft){S.draft[el.dataset.f]=el.value}
});
window.addEventListener("resize",certScale);
if(S.key)load();else render();
</script>
</body>
</html>
