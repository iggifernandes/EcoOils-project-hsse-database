<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoOils HSSE Database</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#edf1ef; --card:#ffffff; --ink:#1b2927; --mute:#5b6d69; --line:#d3dcd9; --accent:#0a6c5a; --accent-ink:#ffffff;
  --soft:#e3f0ec; --bad:#b42318; --bad-bg:#fbe3df; --ok:#17744a; --banner:#0a6c5a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1a18; --card:#16231f; --ink:#e6f0ed; --mute:#98aca6; --line:#2a3d37; --accent:#4cc4a6; --accent-ink:#062018;
  --soft:#1c3029; --bad:#ff8f84; --bad-bg:#40191a; --ok:#5fd29a; --banner:#0e4a3e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif;padding:0 16px 110px}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 12px}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 12px}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.full{grid-column:1/-1}
label.f{display:block;min-width:0}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{padding:5px 12px;font-size:13px}
.btn.d{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.msg.ok{background:var(--soft);color:var(--ok)}
.note{color:var(--mute);font-size:13px}
.gate{max-width:440px;margin:6vh auto 0}
.gate h1{font-size:26px;line-height:1.15;margin:0 0 6px}
.entry{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg)}
.entry .row.head{justify-content:space-between;margin-bottom:8px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--soft);border:3px solid var(--card);object-fit:cover;display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filebox input[type=file]{width:auto;max-width:100%;border:0;padding:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* profile view */
.hero{padding:0;overflow:hidden}
.banner{height:84px;background:var(--banner)}
.hero .body{padding:0 18px 18px}
.hero .avatar{margin-top:-48px;width:104px;height:104px}
.hero h1{font-size:23px;margin:10px 0 0;line-height:1.2}
.headline{font-size:15px;margin-top:2px}
.sub{color:var(--mute);font-size:13.5px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--ink);text-decoration:none;word-break:break-all}
a.chip{color:var(--accent);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .it:last-child{padding-bottom:0}
.tl b{display:block}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
dl.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.bio dt{font-size:12.5px;color:var(--mute);font-weight:600}
dl.bio dd{margin:0;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== SET THIS after you deploy Code.gs as a web app (see README.md) ===== */
const API = "https://script.google.com/macros/s/AKfycbzhdzryHX74sTpd71d1CA1tYd_jjnOCJ32t8JuOM_yL3Ww_RlNCZWGqMtqfSC-HJm8/exec";
/* Projects shown in the drop-down. Only Mentari for now. */
const PROJECTS = ["Mentari"];
const COMPANY = "PT EcoOils Jaya Indonesia";
const ICS = ["GSB","WEN","KKS","PBS"];
const POSITIONS = ["Safety Officer","Safety Supervisor","Safety Advisor","Safety Manager","HSE Manager","HSSE Coordinator","Other"];

const TX = {
en:{brand:"EcoOils HSSE Database",sub:"For safety officers and managers of the implementation contractors",
 gateT:"Your site profile",gateP:"Keep your details, CV and certificates up to date. Only the HSSE office can see them.",
 email:"Email",pin:"Passcode (at least 6 characters)",open:"Open my profile",create:"Create my profile",

 saved:"Profile saved.",saving:"Saving...",save:"Save profile",preview:"Preview",edit:"Edit",out:"Sign out",
 s1:"Photo and name",photo:"Profile photo",choose:"Choose photo",name:"Full name",position:"Position",posOther:"Position (type it)",contractor:"Contractor",icOther:"Contractor name",
 s2:"Contact",phone:"Phone",linkedin:"LinkedIn profile link",
 s3:"About",about:"Short summary",quals:"Qualifications",qualsH:"Degrees, NEBOSH, IOSH, first aid, other training",
 s4:"Experience",add:"Add",rm:"Remove",jt:"Job title",co:"Company",from:"From",to:"To (leave empty if current)",desc:"What you did",
 s5:"Education",school:"School or institute",degree:"Degree or course",year:"Year",
 s6:"Certificates",ct:"Certificate name",ci:"Issued by",cd:"Issue date",ce:"Expiry date",cf:"File (PDF or image)",have:"File on record",
 s7:"CV",cvOn:"CV on record",cvNone:"No CV uploaded yet",cvRm:"Remove CV",cvH:"PDF or Word, up to 8 MB",
 s8:"Personal details",dob:"Date of birth",nat:"Nationality",city:"Home city and country",lang:"Languages",en:"Emergency contact name",ep:"Emergency contact phone",

 join:"Date of joining the Project",project:"Project",projOther:"Project name",joined:"Joined",hint:"Your status on site and leaving date are kept by the HSSE office."},
id:{brand:"EcoOils HSSE Database",sub:"Untuk petugas dan manajer keselamatan kontraktor pelaksana",
 gateT:"Profil lokasi Anda",gateP:"Perbarui data, CV dan sertifikat Anda. Hanya kantor HSSE yang dapat melihatnya.",
 email:"Email",pin:"Kode akses (minimal 6 karakter)",open:"Buka profil saya",create:"Buat profil saya",
 consent:"Saya setuju EcoOils HSSE menyimpan data dan dokumen saya untuk catatan lokasi.",
 nf:"Profil untuk email ini tidak ditemukan. Pilih Buat profil saya.",bp:"Email atau kode akses salah.",pr:"Kode akses Anda direset oleh kantor HSSE. Isi kode akses baru (minimal 6 karakter) lalu ketuk Buka profil saya.",
 weak:"Kode akses minimal 6 karakter.",bemail:"Masukkan email yang valid.",nname:"Isi nama lengkap Anda.",ncons:"Centang persetujuan untuk membuat profil.",
 big:"Ukuran berkas terlalu besar (maksimal 8 MB).",btype:"Jenis berkas tidak diterima. Gunakan PDF, JPG, PNG atau Word.",srv:"Terjadi kesalahan. Coba lagi sebentar lagi.",nosetup:"Situs belum terhubung. Isi tautan web app di index.html.",
 saved:"Profil tersimpan.",saving:"Menyimpan...",save:"Simpan profil",preview:"Pratinjau",edit:"Ubah",out:"Keluar",
 s1:"Foto dan nama",photo:"Foto profil",choose:"Pilih foto",name:"Nama lengkap",position:"Jabatan",posOther:"Jabatan (ketik)",contractor:"Kontraktor",icOther:"Nama kontraktor",
 s2:"Kontak",phone:"Telepon",linkedin:"Tautan profil LinkedIn",
 s3:"Tentang",about:"Ringkasan singkat",quals:"Kualifikasi",qualsH:"Gelar, NEBOSH, IOSH, P3K, pelatihan lain",
 s4:"Pengalaman",add:"Tambah",rm:"Hapus",jt:"Jabatan",co:"Perusahaan",from:"Dari",to:"Sampai (kosongkan jika masih)",desc:"Pekerjaan Anda",
 s5:"Pendidikan",school:"Sekolah atau institut",degree:"Gelar atau kursus",year:"Tahun",
 s6:"Sertifikat",ct:"Nama sertifikat",ci:"Diterbitkan oleh",cd:"Tanggal terbit",ce:"Tanggal kedaluwarsa",cf:"Berkas (PDF atau gambar)",have:"Berkas tersimpan",

 s8:"Data pribadi",dob:"Tanggal lahir",nat:"Kewarganegaraan",city:"Kota dan negara asal",lang:"Bahasa",en:"Nama kontak darurat",ep:"Telepon kontak darurat",
 present:"Sekarang",none:"Belum ada",onsite:"Di lokasi",left:"Sudah keluar",expires:"Berlaku sampai",issued:"Terbit",

};
let lang="en";try{const l=localStorage.getItem("icp-lang");if(l==="id"||l==="en")lang=l;else if((navigator.language||"").startsWith("id"))lang="id"}catch(e){}
const t=k=>TX[lang][k]||TX.en[k]||k;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const blankProfile=()=>({name:"",startDate:"",project:PROJECTS[0],projectOther:"",position:"Safety Officer",positionOther:"",contractor:"GSB",contractorOther:"",phone:"",linkedin:"",dob:"",nationality:"",city:"",languages:"",emergencyName:"",emergencyPhone:"",about:"",qualifications:"",experience:[],education:[],certs:[],photo:null,hasCv:false,cvName:"",status:"onsite"});
const S={screen:"gate",email:"",pin:"",consent:false,isNew:false,P:blankProfile(),newPhoto:null,newCv:null,removeCv:false,certFiles:{},busy:false,msg:null,msgOk:false};

/* ---------- API ---------- */
async function api(body){
  if(!API||API.startsWith("PASTE_"))throw new Error("nosetup");
  const r=await fetch(API,{method:"POST",body:JSON.stringify(body)});
  return r.json();
}
const ERR={not_found:"nf",bad_pin:"bp",pin_reset:"pr",weak_pin:"weak",bad_email:"bemail",no_name:"nname",no_consent:"ncons",file_too_large:"big",bad_type:"btype"};
function errText(e){return t(ERR[e]||"srv")}
function setMsg(m,ok){S.msg=m;S.msgOk=!!ok}

/* ---------- files ---------- */
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function fileObj(file){
  if(file.size>8*1024*1024){setMsg(t("big"));render();return null}
  const okType=/^(application\/pdf|image\/(jpeg|png|webp)|application\/msword|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document)$/.test(file.type);
  if(!okType){setMsg(t("btype"));render();return null}
  return{name:file.name,mime:file.type,data:await readB64(file)};
}
function squarePhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const n=480,c=document.createElement("canvas");c.width=n;c.height=n;
      const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
      c.getContext("2d").drawImage(img,sx,sy,s,s,0,0,n,n);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}

/* ---------- helpers ---------- */
function mFmt(m){if(!m)return"";const d=new Date(m+"-01T00:00:00");return isNaN(d)?m:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{month:"short",year:"numeric"})}
function dFmt(m){if(!m)return"";const d=new Date(m+"T00:00:00");return isNaN(d)?m:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"short",year:"numeric"})}
const posName=p=>p.position==="Other"?(p.positionOther||""):p.position;
const projName=p=>p.project==="Other"?(p.projectOther||""):(p.project||"");
const icName=p=>p.contractor==="Other"?(p.contractorOther||""):p.contractor;
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
function avatar(p){return `<div class="avatar">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(p.name))}</div>`}

/* ---------- render ---------- */
function topbar(){return `<div class="top"><div class="brand">${esc(t("brand"))}<small>${esc(COMPANY)}</small></div>
 <div class="seg" role="group" aria-label="Language"><button data-a="lang" data-v="en" aria-pressed="${lang==="en"}">EN</button><button data-a="lang" data-v="id" aria-pressed="${lang==="id"}">ID</button></div></div>`}
function msgHtml(){return S.msg?`<div class="msg ${S.msgOk?"ok":""}" role="status">${esc(S.msg)}</div>`:""}

function render(){
  const app=document.getElementById("app");
  document.documentElement.lang=lang;
  let h=topbar();
  if(S.screen==="gate")h+=gate();else if(S.screen==="view")h+=view();else h+=editor();
  app.innerHTML=h;
}
function gate(){
  return `<div class="gate"><h1>${esc(t("gateT"))}</h1><p class="note" style="margin-top:0">${esc(t("gateP"))}</p>${msgHtml()}
  <div class="card"><div class="grid"><label class="f full"><span>${esc(t("email"))}</span><input id="g_email" type="email" autocomplete="email" value="${esc(S.email)}"></label>
  <label class="f full"><span>${esc(t("pin"))}</span><input id="g_pin" type="password" autocomplete="current-password" value="${esc(S.pin)}"></label></div>
  <label class="row" style="margin-top:12px;align-items:flex-start"><input type="checkbox" id="g_consent"${S.consent?" checked":""}><span class="note">${esc(t("consent"))}</span></label>
  <div class="row" style="margin-top:14px"><button class="btn p" data-a="login"${S.busy?" disabled":""}>${esc(t("open"))}</button><button class="btn" data-a="register"${S.busy?" disabled":""}>${esc(t("create"))}</button></div></div></div>`;
}
function inp(k,l,type,ph){return `<label class="f"><span>${esc(t(l))}</span><input data-f="${k}" type="${type||"text"}" value="${esc(S.P[k])}"${ph?` placeholder="${esc(ph)}"`:""}></label>`}
function ta(k,l,ph){return `<label class="f full"><span>${esc(t(l))}</span><textarea data-f="${k}"${ph?` placeholder="${esc(ph)}"`:""}>${esc(S.P[k])}</textarea></label>`}
function opts(a,cur){return a.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("")}
function editor(){
  const P=S.P;
  let h=msgHtml();
  h+=`<div class="card"><h2>${esc(t("s1"))}</h2><div class="row" style="align-items:center">${avatar(P)}<div><label class="btn s" for="photoIn">${esc(t("choose"))}</label><input id="photoIn" type="file" accept="image/*" class="hidden"></div></div>
  <div class="grid" style="margin-top:14px">${inp("name","name")}
  <label class="f"><span>${esc(t("position"))}</span><select data-f="position" data-r="1">${opts(POSITIONS,P.position)}</select></label>
  ${P.position==="Other"?inp("positionOther","posOther"):""}
  <label class="f"><span>${esc(t("contractor"))}</span><select data-f="contractor" data-r="1">${opts([...ICS,"Other"],P.contractor)}</select></label>
  ${P.contractor==="Other"?inp("contractorOther","icOther"):""}
  <label class="f"><span>${esc(t("project"))}</span><select data-f="project" data-r="1">${opts(PROJECTS,P.project)}</select></label>
  ${P.project==="Other"?inp("projectOther","projOther"):""}${inp("startDate","join","date")}</div></div>
  <div class="card"><h2>${esc(t("s2"))}</h2><div class="grid"><label class="f"><span>${esc(t("email"))}</span><input value="${esc(S.email)}" disabled></label>${inp("phone","phone","tel")}
  <label class="f full"><span>${esc(t("linkedin"))}</span><input data-f="linkedin" type="url" value="${esc(P.linkedin)}" placeholder="https://www.linkedin.com/in/..."></label></div></div>
  <div class="card"><h2>${esc(t("s3"))}</h2><div class="grid">${ta("about","about")}${ta("qualifications","quals",t("qualsH"))}</div></div>
  <div class="card"><h2>${esc(t("s4"))}</h2>${P.experience.map((x,i)=>`<div class="entry"><div class="row head"><b>#${i+1}</b><button class="btn s d" data-a="rmList" data-l="experience" data-i="${i}">${esc(t("rm"))}</button></div>
   <div class="grid"><label class="f"><span>${esc(t("jt"))}</span><input data-l="experience" data-i="${i}" data-k="title" value="${esc(x.title)}"></label>
   <label class="f"><span>${esc(t("co"))}</span><input data-l="experience" data-i="${i}" data-k="company" value="${esc(x.company)}"></label>
   <label class="f"><span>${esc(t("from"))}</span><input type="month" data-l="experience" data-i="${i}" data-k="from" value="${esc(x.from)}"></label>
   <label class="f"><span>${esc(t("to"))}</span><input type="month" data-l="experience" data-i="${i}" data-k="to" value="${esc(x.to)}"></label>
   <label class="f full"><span>${esc(t("desc"))}</span><textarea data-l="experience" data-i="${i}" data-k="description">${esc(x.description)}</textarea></label></div></div>`).join("")}
   <button class="btn s" data-a="addList" data-l="experience">+ ${esc(t("add"))}</button></div>
  <div class="card"><h2>${esc(t("s5"))}</h2>${P.education.map((x,i)=>`<div class="entry"><div class="row head"><b>#${i+1}</b><button class="btn s d" data-a="rmList" data-l="education" data-i="${i}">${esc(t("rm"))}</button></div>
   <div class="grid"><label class="f"><span>${esc(t("school"))}</span><input data-l="education" data-i="${i}" data-k="school" value="${esc(x.school)}"></label>
   <label class="f"><span>${esc(t("degree"))}</span><input data-l="education" data-i="${i}" data-k="degree" value="${esc(x.degree)}"></label>
   <label class="f"><span>${esc(t("year"))}</span><input data-l="education" data-i="${i}" data-k="year" value="${esc(x.year)}" inputmode="numeric"></label></div></div>`).join("")}
   <button class="btn s" data-a="addList" data-l="education">+ ${esc(t("add"))}</button></div>
  <div class="card"><h2>${esc(t("s6"))}</h2>${P.certs.map((x,i)=>`<div class="entry"><div class="row head"><b>#${i+1}</b><button class="btn s d" data-a="rmList" data-l="certs" data-i="${i}">${esc(t("rm"))}</button></div>
   <div class="grid"><label class="f"><span>${esc(t("ct"))}</span><input data-l="certs" data-i="${i}" data-k="title" value="${esc(x.title)}"></label>
   <label class="f"><span>${esc(t("ci"))}</span><input data-l="certs" data-i="${i}" data-k="issuer" value="${esc(x.issuer)}"></label>
   <label class="f"><span>${esc(t("cd"))}</span><input type="date" data-l="certs" data-i="${i}" data-k="issued" value="${esc(x.issued)}"></label>
   <label class="f"><span>${esc(t("ce"))}</span><input type="date" data-l="certs" data-i="${i}" data-k="expiry" value="${esc(x.expiry)}"></label>
   <label class="f full"><span>${esc(t("cf"))}${x.fileName&&!S.certFiles[i]?` · ${esc(t("have"))}: ${esc(x.fileName)}`:""}${S.certFiles[i]?` · ${esc(S.certFiles[i].name)}`:""}</span><input type="file" accept=".pdf,image/*" data-cf="${i}"></label></div></div>`).join("")}
   <button class="btn s" data-a="addList" data-l="certs">+ ${esc(t("add"))}</button></div>
  <div class="card"><h2>${esc(t("s7"))}</h2><p class="note" style="margin-top:0">${esc(S.newCv?S.newCv.name:(P.hasCv&&!S.removeCv?t("cvOn")+": "+P.cvName:t("cvNone")))}</p>
   <div class="filebox"><input type="file" id="cvIn" accept=".pdf,.doc,.docx,application/pdf"><span class="note">${esc(t("cvH"))}</span>${P.hasCv&&!S.removeCv&&!S.newCv?`<button class="btn s d" data-a="rmCv">${esc(t("cvRm"))}</button>`:""}</div></div>
  <div class="card"><h2>${esc(t("s8"))}</h2><div class="grid">${inp("dob","dob","date")}${inp("nationality","nat")}${inp("city","city")}${inp("languages","lang")}${inp("emergencyName","en")}${inp("emergencyPhone","ep","tel")}</div><p class="note">${esc(t("hint"))}</p></div>
  <div class="bar"><div class="in"><button class="btn" data-a="preview">${esc(t("preview"))}</button><div class="row"><button class="btn s" data-a="signout">${esc(t("out"))}</button><button class="btn p" data-a="save"${S.busy?" disabled":""}>${esc(S.busy?t("saving"):t("save"))}</button></div></div></div>`;
  return h;
}
function view(){
  const P=S.P,line=[posName(P),icName(P)].filter(Boolean).join(" · ");
  const sec=(title,body)=>body?`<div class="card"><h2>${esc(title)}</h2>${body}</div>`:"";
  const exp=P.experience.map(x=>`<div class="it"><b>${esc(x.title)}${x.company?` · ${esc(x.company)}`:""}</b><span class="sub">${esc(mFmt(x.from))}${x.from||x.to?" – ":""}${esc(x.to?mFmt(x.to):(x.from?t("present"):""))}</span>${x.description?`<div class="pre">${esc(x.description)}</div>`:""}</div>`).join("");
  const edu=P.education.map(x=>`<div class="it"><b>${esc(x.school)}</b><span class="sub">${esc([x.degree,x.year].filter(Boolean).join(" · "))}</span></div>`).join("");
  const cer=P.certs.map(x=>`<div class="it"><b>${esc(x.title)}</b><span class="sub">${esc([x.issuer,x.issued?t("issued")+" "+dFmt(x.issued):"",x.expiry?t("expires")+" "+dFmt(x.expiry):""].filter(Boolean).join(" · "))}</span></div>`).join("");
  const bio=[["dob",dFmt(P.dob)],["nat",P.nationality],["city",P.city],["lang",P.languages],["en",[P.emergencyName,P.emergencyPhone].filter(Boolean).join(" · ")]].filter(x=>x[1]).map(x=>`<div><dt>${esc(t(x[0]))}</dt><dd>${esc(x[1])}</dd></div>`).join("");
  return `${msgHtml()}<div class="card hero"><div class="banner"></div><div class="body">${avatar(P)}<h1>${esc(P.name||"—")}</h1><div class="headline">${esc(line)}</div><div class="sub">${esc([projName(P),COMPANY].filter(Boolean).join(" · "))}</div>
  <div class="chips"><span class="chip">${esc(P.status==="left"?t("left"):t("onsite"))}</span>${P.startDate?`<span class="chip">${esc(t("joined"))} ${esc(dFmt(P.startDate))}</span>`:""}${S.email?`<span class="chip">${esc(S.email)}</span>`:""}${P.phone?`<span class="chip">${esc(P.phone)}</span>`:""}${P.linkedin?`<a class="chip" href="${esc(P.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}${P.hasCv||S.newCv?`<span class="chip">CV ✓</span>`:""}</div></div></div>
  ${sec(t("s3"),(P.about?`<div class="pre">${esc(P.about)}</div>`:"")+(P.qualifications?`<div class="pre note" style="margin-top:8px">${esc(P.qualifications)}</div>`:""))}
  ${sec(t("s4"),exp?`<div class="tl">${exp}</div>`:"")}${sec(t("s5"),edu?`<div class="tl">${edu}</div>`:"")}${sec(t("s6"),cer?`<div class="tl">${cer}</div>`:"")}
  ${sec(t("s8"),bio?`<dl class="bio">${bio}</dl>`:"")}
  <div class="bar"><div class="in"><button class="btn" data-a="editMode">← ${esc(t("edit"))}</button><button class="btn p" data-a="save"${S.busy?" disabled":""}>${esc(S.busy?t("saving"):t("save"))}</button></div></div>`;
}

/* ---------- actions ---------- */
async function doLogin(){
  const email=document.getElementById("g_email").value.trim(),pin=document.getElementById("g_pin").value;
  S.email=email;S.pin=pin;S.consent=document.getElementById("g_consent").checked;
  S.busy=true;setMsg(null);render();
  try{
    const r=await api({action:"login",email,pin});
    if(r.ok){S.P={...blankProfile(),...r.profile};S.isNew=false;S.screen="edit";S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};setMsg(null)}
    else setMsg(errText(r.error));
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();
}
async function doRegister(){
  const email=document.getElementById("g_email").value.trim(),pin=document.getElementById("g_pin").value;
  S.email=email;S.pin=pin;S.consent=document.getElementById("g_consent").checked;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){setMsg(t("bemail"));render();return}
  if(pin.length<6){setMsg(t("weak"));render();return}
  if(!S.consent){setMsg(t("ncons"));render();return}
  S.busy=true;setMsg(null);render();
  try{
    const r=await api({action:"login",email,pin});
    if(r.ok){S.P={...blankProfile(),...r.profile};S.isNew=false;S.screen="edit"}   /* already registered: open it, never overwrite */
    else if(r.error==="not_found"){S.P=blankProfile();S.isNew=true;S.screen="edit"}
    else{setMsg(errText(r.error));S.busy=false;render();return}
    S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};setMsg(null);
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();
}
async function doSave(){
  if(!(S.P.name||"").trim()){setMsg(t("nname"));S.screen==="view"&&(S.screen="edit");render();window.scrollTo(0,0);return}
  S.busy=true;setMsg(null);render();
  const files={};if(S.newPhoto)files.photo={mime:"image/jpeg",data:S.newPhoto,name:"photo.jpg"};if(S.newCv)files.cv=S.newCv;
  const profile={...S.P};delete profile.photo;
  try{
    const r=await api({action:"save",email:S.email,pin:S.pin,consent:S.consent,profile,files,removeCv:S.removeCv&&!S.newCv,certFiles:S.certFiles});
    if(r.ok){S.P={...blankProfile(),...r.profile};S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};S.isNew=false;setMsg(t("saved"),true)}
    else setMsg(errText(r.error));
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();window.scrollTo(0,0);
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="lang"){lang=el.dataset.v;try{localStorage.setItem("icp-lang",lang)}catch(_){}render()}
  else if(a==="login")await doLogin();
  else if(a==="register")await doRegister();
  else if(a==="save")await doSave();
  else if(a==="preview"){S.screen="view";setMsg(null);render();window.scrollTo(0,0)}
  else if(a==="editMode"){S.screen="edit";render();window.scrollTo(0,0)}
  else if(a==="signout"){S.screen="gate";S.pin="";S.P=blankProfile();setMsg(null);render()}
  else if(a==="addList"){const l=el.dataset.l;S.P[l].push(l==="experience"?{title:"",company:"",from:"",to:"",description:""}:l==="education"?{school:"",degree:"",year:""}:{title:"",issuer:"",issued:"",expiry:"",fileId:"",fileName:""});render()}
  else if(a==="rmList"){const l=el.dataset.l,i=+el.dataset.i;S.P[l].splice(i,1);if(l==="certs"){const nf={};Object.keys(S.certFiles).forEach(k=>{k=+k;if(k<i)nf[k]=S.certFiles[k];else if(k>i)nf[k-1]=S.certFiles[k]});S.certFiles=nf}render()}
  else if(a==="rmCv"){S.removeCv=true;render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="g_email"){S.email=el.value;return}
  if(el.id==="g_pin"){S.pin=el.value;return}
  if(el.dataset.f&&!el.dataset.r){S.P[el.dataset.f]=el.value}
  else if(el.dataset.l){S.P[el.dataset.l][+el.dataset.i][el.dataset.k]=el.value}
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.f&&el.dataset.r){S.P[el.dataset.f]=el.value;render();return}
  if(el.id==="photoIn"&&el.files[0]){
    try{const url=await squarePhoto(el.files[0]);S.P.photo=url;S.newPhoto=url.split(",")[1];render()}catch(_){setMsg(t("btype"));render()}
  }
  else if(el.id==="cvIn"&&el.files[0]){const f=await fileObj(el.files[0]);if(f){S.newCv=f;S.removeCv=false;setMsg(null);render()}else el.value=""}
  else if(el.dataset.cf!==undefined&&el.files[0]){const f=await fileObj(el.files[0]);if(f){S.certFiles[el.dataset.cf]=f;setMsg(null);render()}else el.value=""}
});
render();
</script>
