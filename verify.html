<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify a certificate - EcoOils HSSE</title>
<style>
:root{--accent:#44a276;--accent-text:#2b7a55;--gold:#ffc600;--bg:#f2f6f4;--surface:#fff;--line:#d9e2dd;--ink:#1f2a25;--mute:#5d6b64;--ok:#1d7a4d;--ok-bg:#e0f3e8;--bad:#b3261e;--bad-bg:#fbe4e2;--warn:#8a5a00;--warn-bg:#fff2cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201b;--surface:#1c2b25;--line:#2c3f36;--ink:#e8f0ec;--mute:#9fb3a9;--accent-text:#7fd1a8;--ok:#7fd1a8;--ok-bg:#1d3a2c;--bad:#ff9e96;--bad-bg:#3a1e1c;--warn:#ffd466;--warn-bg:#3a3000}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px;border-bottom:4px solid var(--gold)}
.top img{height:38px}.seg{display:inline-flex;border:1px solid var(--accent);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--accent-text);padding:6px 12px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
h1{font-size:22px;margin:20px 0 6px}p{margin:6px 0}.note{color:var(--mute);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:4px}
button.go{margin-top:12px;border:0;background:var(--accent);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}button.go:disabled{opacity:.6}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.valid{background:var(--ok-bg);color:var(--ok)}.revoked{background:var(--bad-bg);color:var(--bad)}.unknown{background:var(--warn-bg);color:var(--warn)}
dl{margin:12px 0 0}dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-top:10px}dd{margin:2px 0 0;font-weight:600}
.small{font-size:13px;color:var(--mute);margin-top:14px}
.ok{background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:8px;margin-top:10px}
</style></head><body><div class="wrap">

let lang="en";try{const l=localStorage.getItem("icv-lang");if(l==="id"||l==="en")lang=l}catch(e){}
const q=new URLSearchParams(location.search);
const S={no:(q.get("c")||"").trim(),res:null,busy:false,err:"",sent:false};
const t=k=>TX[lang][k]||k,esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dF=i=>{if(!i)return"";const d=new Date(i+"T00:00:00");return isNaN(d)?i:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"long",year:"numeric"})};
async function api(b){const r=await fetch(API,{method:"POST",body:JSON.stringify(b)});return r.json()}
async function check(){
  S.busy=true;S.err="";S.sent=false;render();
  try{const r=await api({action:"verify",no:S.no});if(r.ok)S.res=r;else S.err=t(r.error==="busy"?"busy":"err")}catch(e){S.err=t("err")}
  S.busy=false;render();
}
function result(){
  const r=S.res;if(!r)return"";
  if(!r.found)return `<div class="card"><span class="badge unknown">${esc(t("unknown"))}</span><p>${esc(t("unkP"))}</p></div>${ask()}`;
  const rv=r.status==="revoked";
  return `<div class="card"><span class="badge ${rv?"revoked":"valid"}">${esc(t(rv?"revoked":"valid"))}</span><p>${esc(t(rv?"revokedP":"validP"))}</p>
  <dl><dt>${esc(t("no"))}</dt><dd>${esc(r.no)}</dd><dt>${esc(t("name"))}</dt><dd>${esc(r.name)}</dd><dt>${esc(t("pos"))}</dt><dd>${esc(r.position)}</dd>
  <dt>${esc(t("emp"))}</dt><dd>${esc(r.contractor)}</dd><dt>${esc(t("proj"))}</dt><dd>EcoOils ${esc(r.project)} · PT EcoOils Jaya Indonesia</dd>
  <dt>${esc(t("per"))}</dt><dd>${esc(dF(r.startDate))} ${esc(t("to"))} ${esc(dF(r.endDate))}</dd><dt>${esc(t("iss"))}</dt><dd>${esc(dF(r.issued))}</dd></dl>
  <p class="note" style="margin-top:12px">${esc(t("notEmp"))}</p></div>`;
}
function ask(){
  if(S.sent)return `<div class="ok">${esc(t("sent"))}</div>`;
  return `<div class="card"><b>${esc(t("askH"))}</b><p class="note">${esc(t("askP"))}</p>
  <label>${esc(t("who"))}<input id="aw" autocomplete="name"></label><label>${esc(t("em"))}<input id="ae" type="email" autocomplete="email"></label>
  <label>${esc(t("msg"))}<textarea id="am" rows="3"></textarea></label><button class="go" id="asend"${S.busy?" disabled":""}>${esc(t("send"))}</button></div>`;
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===lang)));
  document.getElementById("foot").textContent=t("foot");
  document.getElementById("app").innerHTML=`<h1>${esc(t("h"))}</h1><p class="note">${esc(t("p"))}</p>
  <div class="card"><label>${esc(t("no"))}<input id="no" value="${esc(S.no)}" autocapitalize="characters" autocomplete="off" placeholder="ECO-XXXX-XXXX"></label>
  <button class="go" id="chk"${S.busy?" disabled":""}>${esc(S.busy?t("chking"):t("chk"))}</button>${S.err?`<p style="color:var(--bad)">${esc(S.err)}</p>`:""}</div>${result()}`;
}
document.addEventListener("click",async e=>{
  const sg=e.target.closest(".seg button");if(sg){lang=sg.dataset.v;try{localStorage.setItem("icv-lang",lang)}catch(_){}render();return}
  if(e.target.id==="chk"){S.no=document.getElementById("no").value.trim();if(S.no)check();return}
  if(e.target.id==="asend"){
    const em=document.getElementById("ae").value.trim();
    S.busy=true;S.err="";
    try{const r=await api({action:"verifyRequest",no:S.no,who:document.getElementById("aw").value,email:em,note:document.getElementById("am").value});
      if(r.ok)S.sent=true;else S.err=t(r.error==="bad_email"?"bad_email":r.error==="busy"?"busy":"err")}catch(_){S.err=t("err")}
    S.busy=false;render();
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="no"){S.no=e.target.value.trim();if(S.no)check()}});
render();if(S.no)check();
</script></body></html>
