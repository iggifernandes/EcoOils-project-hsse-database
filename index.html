<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoOils HSSE Database</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f7f5; --card:#ffffff; --ink:#221e1f; --mute:#5f6b66; --line:#d6e0db; --accent:#44a276; --accent-ink:#ffffff; --accent-text:#2b7a55;
  --gold:#ffc600; --soft:#e4f2ec; --bad:#b42318; --bad-bg:#fbe3df; --ok:#216b49; --banner:#44a276; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif;padding:0 16px 110px}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 12px}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto;display:block}
.brand small{display:block;font-weight:600;color:var(--mute);font-size:12px;line-height:1.25}
.top{border-bottom:3px solid var(--gold);margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 12px}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.full{grid-column:1/-1}
label.f{display:block;min-width:0}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{padding:5px 12px;font-size:13px}
.btn.d{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shellfoot{text-align:center;padding:6px 16px 90px}.shellfoot img{height:22px;width:auto;opacity:.9}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.msg.ok{background:var(--soft);color:var(--ok)}
.note{color:var(--mute);font-size:13px}
.gate{max-width:440px;margin:6vh auto 0}
.gate h1{font-size:26px;line-height:1.15;margin:0 0 6px}
.entry{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--bg)}
.entry .row.head{justify-content:space-between;margin-bottom:8px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--soft);border:3px solid var(--card);box-shadow:0 0 0 2px var(--gold);object-fit:cover;display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--accent-text);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filebox input[type=file]{width:auto;max-width:100%;border:0;padding:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* profile view */
.hero{padding:0;overflow:hidden}
.banner{height:84px;background:var(--banner);border-bottom:5px solid var(--gold)}
.hero .body{padding:0 18px 18px}
.hero .avatar{margin-top:-48px;width:104px;height:104px}
.hero h1{font-size:23px;margin:10px 0 0;line-height:1.2}
.headline{font-size:15px;margin-top:2px}
.sub{color:var(--mute);font-size:13.5px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--ink);text-decoration:none;word-break:break-all}
a.chip{color:var(--accent-text);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .it:last-child{padding-bottom:0}
.tl b{display:block}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
dl.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.bio dt{font-size:12.5px;color:var(--mute);font-weight:600}
dl.bio dd{margin:0;overflow-wrap:anywhere}
.hidden{display:none!important}
.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.avatar.bad{box-shadow:0 0 0 3px var(--bad)}
.mask{font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);white-space:nowrap}
.req{color:var(--bad);font-weight:700}
.reqnote{background:var(--soft);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.crop-bg{position:fixed;inset:0;background:rgba(34,30,31,.6);z-index:20;display:grid;place-items:center;padding:16px}
.crop{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:340px;border-top:5px solid var(--gold)}
.crop h3{margin:0 0 4px;font-size:16px}
.crop canvas{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:10px auto;border-radius:8px;touch-action:none;cursor:grab;background:#ddd}
.crop .zr{display:flex;align-items:center;gap:8px}
.crop .zr button{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);background:var(--card);color:var(--accent-text);font-size:20px;line-height:1;cursor:pointer;flex:none}
.crop input[type=range]{padding:0;border:0;accent-color:var(--accent)}
</style>
</head>

const ACR=new Set("HSSE HSE HSEQ NEBOSH IGC NGC IDIP NDIP IDP EIDP IOSH IRCA CMIOSH TECHIOSH PTW LOTO PPE CSP OSHA ISO SMK3 K3 SOP JSA JHA HAZOP HAZID QA QC EPC EPCI CV PT PBS GSB WEN KKS SEZ NDT TBT MSDS SDS UK USA UAE BNSP AK3 SKKNI P3K CHST OHSAS HR BSC MSC MBA HND".split(" "));
const SMALLW=new Set("and of the in for on at to a an or by with di dan untuk dari yang pada ke".split(" "));
function titleCase(s){
  let first=true;
  return s.replace(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’]*/g,(w,off)=>{
    const lead=off===0||/[\s\-\/(.,]/.test(s[off-1]);
    const isFirst=first;first=false;
    if(!lead)return w;
    if(!isFirst&&SMALLW.has(w.toLowerCase())&&w===w.toLowerCase())return w;
    return w.charAt(0).toUpperCase()+w.slice(1);
  });
}
function sentenceCase(s){
  s=s.replace(/(^\s*|[.!?]\s+|\n\s*|[•\-–*]\s+)([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
  return s.replace(/\bi\b(?=\s|'|’|$)/g,"I");
}
function fixCaps(s,mode){
  const letters=s.replace(/[^A-Za-z]/g,"");
  if(letters.length<6||letters.replace(/[^A-Z]/g,"").length/letters.length<0.8)return s;
  const low=s.toLowerCase().replace(/[A-Za-z0-9]+/g,w=>ACR.has(w.toUpperCase())?w.toUpperCase():w);
  return low;
}
function liveFix(v,mode){return mode==="title"?titleCase(v):mode==="sent"?sentenceCase(v):v}
function fullFix(v,mode){
  if(!mode)return v;
  v=v.replace(/[ \t]{2,}/g," ").replace(/\s+([,;:!?])/g,"$1").replace(/([,;:!?])(?=[A-Za-z])/g,"$1 ").replace(/[ \t]+$/gm,"").trim();
  v=fixCaps(v,mode);
  v=liveFix(v,mode);
  return v.replace(/\b[A-Za-z0-9]{2,8}\b/g,w=>ACR.has(w.toUpperCase())?w.toUpperCase():w);
}

async function api(body){
  if(!API||API.startsWith("PASTE_"))throw new Error("nosetup");
  const r=await fetch(API,{method:"POST",body:JSON.stringify(body)});
  return r.json();
}
const ERR={not_found:"nf",bad_pin:"bp",pin_reset:"pr",weak_pin:"weak",bad_email:"bemail",no_name:"nname",no_consent:"ncons",no_ktp:"nktp",file_too_large:"big",bad_type:"btype"};
function errText(e){return t(ERR[e]||"srv")}
function setMsg(m,ok){S.msg=m;S.msgOk=!!ok}

/* ---------- files ---------- */
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function fileObj(file){
  if(file.size>8*1024*1024){setMsg(t("big"));render();return null}
  const okType=/^(application\/pdf|image\/(jpeg|png|webp)|application\/msword|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document)$/.test(file.type);
  if(!okType){setMsg(t("btype"));render();return null}
  return{name:file.name,mime:file.type,data:await readB64(file)};
}
/* Photo crop tool: drag to move, slider / buttons / wheel to zoom. Returns a 480px square JPEG data URL, or null if cancelled. */
function openCrop(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};
    img.onload=()=>{
      const bg=document.createElement("div");bg.className="crop-bg";
      bg.innerHTML=`<div class="crop" role="dialog" aria-modal="true"><h3>${esc(t("cropT"))}</h3><div class="note">${esc(t("cropH"))}</div>
      <canvas width="300" height="300"></canvas>
      <div class="zr"><button type="button" data-z="-" aria-label="Zoom out">−</button><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button type="button" data-z="+" aria-label="Zoom in">+</button></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn s" data-c="x">${esc(t("cancel"))}</button><button type="button" class="btn p s" data-c="ok">${esc(t("use"))}</button></div></div>`;
      document.body.appendChild(bg);
      const cv=bg.querySelector("canvas"),rg=bg.querySelector("input"),V=300;
      let zoom=1,cx=img.width/2,cy=img.height/2;      /* cx,cy = image point shown at centre */
      const base=()=>V/Math.min(img.width,img.height);  /* scale at zoom 1 so image covers square */
      function clamp(){const sc=base()*zoom,hw=V/2/sc;cx=Math.min(Math.max(cx,hw),img.width-hw);cy=Math.min(Math.max(cy,hw),img.height-hw)}
      function draw(c,size){const sc=base()*zoom*(size/V),g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,size,size);g.drawImage(img,size/2-cx*sc,size/2-cy*sc,img.width*sc,img.height*sc)}
      function paint(){clamp();draw(cv,V)}
      function setZ(z){zoom=Math.min(4,Math.max(1,z));rg.value=zoom;paint()}
      let drag=null;
      cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
      cv.addEventListener("pointermove",e=>{if(!drag)return;const k=V/cv.getBoundingClientRect().width,sc=base()*zoom;cx-=(e.clientX-drag.x)*k/sc;cy-=(e.clientY-drag.y)*k/sc;drag={x:e.clientX,y:e.clientY};paint()});
      const end=()=>{drag=null;cv.style.cursor="grab"};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
      cv.addEventListener("wheel",e=>{e.preventDefault();setZ(zoom*(e.deltaY<0?1.08:1/1.08))},{passive:false});
      rg.addEventListener("input",()=>setZ(+rg.value));
      bg.addEventListener("click",e=>{
        const z=e.target.closest("[data-z]"),c=e.target.closest("[data-c]");
        if(z)setZ(zoom+(z.dataset.z==="+"?.25:-.25));
        else if(c){
          let out=null;
          if(c.dataset.c==="ok"){const o=document.createElement("canvas");o.width=o.height=480;draw(o,480);out=o.toDataURL("image/jpeg",.85)}
          bg.remove();URL.revokeObjectURL(url);res(out);
        }
      });
      paint();
    };
    img.src=url;
  });
}

/* ---------- helpers ---------- */
function mFmt(m){if(!m)return"";const d=new Date(m+"-01T00:00:00");return isNaN(d)?m:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{month:"short",year:"numeric"})}
function dFmt(m){if(!m)return"";const d=new Date(m+"T00:00:00");return isNaN(d)?m:d.toLocaleDateString(lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"short",year:"numeric"})}
const posName=p=>p.position==="Other"?(p.positionOther||""):p.position;
const projName=p=>p.project==="Other"?(p.projectOther||""):(p.project||"");
const icName=p=>p.contractor==="Other"?(p.contractorOther||""):p.contractor;
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";

/* ---------- required items ---------- */
function missingList(){
  const P=S.P,m=[],add=(k,l)=>m.push({k,l});
  const e=v=>!String(v||"").trim();
  if(!(P.photo||S.newPhoto))add("photo",t("photoL"));
  if(e(P.name))add("f:name",t("name"));
  if(P.position==="Other"&&e(P.positionOther))add("f:positionOther",t("posOther"));
  if(P.contractor==="Other"&&e(P.contractorOther))add("f:contractorOther",t("icOther"));
  if(P.project==="Other"&&e(P.projectOther))add("f:projectOther",t("projOther"));
  if(e(P.startDate))add("f:startDate",t("join"));
  if(P.endDate&&P.startDate&&P.endDate<P.startDate)add("f:endDate",t("leave")+" "+t("endBefore"));
  if(ktp4(P.ktp).length!==4)add("f:ktp",t("ktp"));
  [["phone","phone"],["linkedin","linkedin"],["about","about"],["qualifications","quals"],["dob","dob"],["nationality","nat"],["city","city"],["languages","lang"],["emergencyName","en"],["emergencyPhone","ep"]].forEach(([k,l])=>{if(e(P[k]))add("f:"+k,t(l))});
  if(!((P.hasCv&&!S.removeCv)||S.newCv))add("cv",t("cvL"));
  if(!P.experience.length)add("add:experience",t("s4"));
  P.experience.forEach((x,i)=>[["title","jt"],["company","co"],["from","from"],["description","desc"]].forEach(([k,l])=>{if(e(x[k]))add(`l:experience:${i}:${k}`,t("s4")+" #"+(i+1)+": "+t(l))}));
  if(!P.education.length)add("add:education",t("s5"));
  P.education.forEach((x,i)=>[["school","school"],["degree","degree"],["year","year"]].forEach(([k,l])=>{if(e(x[k]))add(`l:education:${i}:${k}`,t("s5")+" #"+(i+1)+": "+t(l))}));
  if(!P.certs.length)add("add:certs",t("s6"));
  P.certs.forEach((x,i)=>{[["title","ct"],["issuer","ci"],["issued","cd"]].forEach(([k,l])=>{if(e(x[k]))add(`l:certs:${i}:${k}`,t("s6")+" #"+(i+1)+": "+t(l))});if(!(x.fileId||S.certFiles[i]))add(`l:certs:${i}:file`,t("s6")+" #"+(i+1)+": "+t("certFile"))});
  return m;
}

/* ---------- actions ---------- */
async function doLogin(){
  const email=document.getElementById("g_email").value.trim(),pin=document.getElementById("g_pin").value;
  S.email=email;S.pin=pin;S.consent=document.getElementById("g_consent").checked;
  S.busy=true;setMsg(null);render();
  try{
    const r=await api({action:"login",email,pin});
    if(r.ok){S.P=normProfile(r.profile);S.isNew=false;S.screen="edit";S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};setMsg(null)}
    else setMsg(errText(r.error));
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();
}
async function doRegister(){
  const email=document.getElementById("g_email").value.trim(),pin=document.getElementById("g_pin").value;
  S.email=email;S.pin=pin;S.consent=document.getElementById("g_consent").checked;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){setMsg(t("bemail"));render();return}
  if(pin.length<6){setMsg(t("weak"));render();return}
  if(!S.consent){setMsg(t("ncons"));render();return}
  S.busy=true;setMsg(null);render();
  try{
    const r=await api({action:"login",email,pin});
    if(r.ok){S.P=normProfile(r.profile);S.isNew=false;S.screen="edit"}   /* already registered: open it, never overwrite */
    else if(r.error==="not_found"){S.P=blankProfile();S.isNew=true;S.screen="edit"}
    else{setMsg(errText(r.error));S.busy=false;render();return}
    S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};setMsg(null);
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();
}
async function doSave(){
  const miss=missingList();
  if(miss.length){
    S.showErr=true;S.miss=new Set(miss.map(x=>x.k));S.screen="edit";
    setMsg(t("reqMsg")+" "+miss.slice(0,6).map(x=>x.l).join(", ")+(miss.length>6?" … (+"+(miss.length-6)+")":""));
    render();const b=document.querySelector(".bad");if(b)b.scrollIntoView({block:"center",behavior:"smooth"});else window.scrollTo(0,0);return;
  }
  S.showErr=false;S.miss=new Set();
  S.busy=true;setMsg(null);render();
  const files={};if(S.newPhoto)files.photo={mime:"image/jpeg",data:S.newPhoto,name:"photo.jpg"};if(S.newCv)files.cv=S.newCv;
  const profile={...S.P};delete profile.photo;profile.ktp=ktp4(profile.ktp);
  try{
    const r=await api({action:"save",email:S.email,pin:S.pin,consent:S.consent,profile,files,removeCv:S.removeCv&&!S.newCv,certFiles:S.certFiles});
    if(r.ok){S.P=normProfile(r.profile);S.newPhoto=null;S.newCv=null;S.removeCv=false;S.certFiles={};S.isNew=false;S.waOffer=true;setMsg(t("saved"),true)}
    else setMsg(errText(r.error));
  }catch(e){setMsg(e&&e.message==="nosetup"?t("nosetup"):t("srv"))}
  S.busy=false;render();window.scrollTo(0,0);
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="lang"){lang=el.dataset.v;try{localStorage.setItem("icp-lang",lang)}catch(_){}render()}
  else if(a==="peek"){const i=document.getElementById("g_pin");const h=i.type==="password";i.type=h?"text":"password";el.textContent=t(h?"hide":"show")}
  else if(a==="wa"){const u=location.origin+location.pathname;window.open("https://wa.me/?text="+encodeURIComponent(t("waMsg")+u+t("waMsg2")),"_blank","noopener")}
  else if(a==="waX"){S.waOffer=false;render()}
  else if(a==="login")await doLogin();
  else if(a==="register")await doRegister();
  else if(a==="save")await doSave();
  else if(a==="preview"){S.screen="view";setMsg(null);render();window.scrollTo(0,0)}
  else if(a==="editMode"){S.screen="edit";render();window.scrollTo(0,0)}
  else if(a==="signout"){S.waOffer=false;S.screen="gate";S.pin="";S.P=blankProfile();setMsg(null);render()}
  else if(a==="addList"){const l=el.dataset.l;S.P[l].push(l==="experience"?{title:"",company:"",from:"",to:"",description:""}:l==="education"?{school:"",degree:"",year:""}:{title:"",issuer:"",issued:"",expiry:"",fileId:"",fileName:""});render()}
  else if(a==="rmList"){const l=el.dataset.l,i=+el.dataset.i;S.P[l].splice(i,1);if(l==="certs"){const nf={};Object.keys(S.certFiles).forEach(k=>{k=+k;if(k<i)nf[k]=S.certFiles[k];else if(k>i)nf[k-1]=S.certFiles[k]});S.certFiles=nf}render()}
  else if(a==="rmCv"){S.removeCv=true;render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="g_email"){S.email=el.value;return}
  if(el.id==="g_pin"){S.pin=el.value;return}
  if(el.dataset.f==="ktp"){const d=el.value.replace(/\D/g,"").slice(0,4);if(d!==el.value)el.value=d;S.P.ktp=d;refreshBad();return}
  const mode=fmtOf(el);
  if(mode&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){const v=liveFix(el.value,mode);if(v!==el.value){const p=el.selectionStart;el.value=v;try{el.setSelectionRange(p,p)}catch(_){}}}
  if(el.dataset.f&&!el.dataset.r){S.P[el.dataset.f]=el.value}
  else if(el.dataset.l){S.P[el.dataset.l][+el.dataset.i][el.dataset.k]=el.value}
  refreshBad();
});
document.addEventListener("change",async e=>{
  const el=e.target;
  const fm=fmtOf(el);
  if(fm&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){
    const v=fullFix(el.value,fm);el.value=v;
    if(el.dataset.f)S.P[el.dataset.f]=v;else if(el.dataset.l)S.P[el.dataset.l][+el.dataset.i][el.dataset.k]=v;
    refreshBad();return;
  }
  if(el.dataset.f&&el.dataset.r){S.P[el.dataset.f]=el.value;render();return}
  if(el.id==="photoIn"&&el.files[0]){
    try{const url=await openCrop(el.files[0]);if(url){S.P.photo=url;S.newPhoto=url.split(",")[1];render();refreshBad()}}catch(_){setMsg(t("btype"));render()}
    el.value="";
  }
  else if(el.id==="cvIn"&&el.files[0]){const f=await fileObj(el.files[0]);if(f){S.newCv=f;S.removeCv=false;setMsg(null);render();refreshBad()}else el.value=""}
  else if(el.dataset.cf!==undefined&&el.files[0]){const f=await fileObj(el.files[0]);if(f){S.certFiles[el.dataset.cf]=f;setMsg(null);render();refreshBad()}else el.value=""}
});
render();
</script>
</body>
</html>
